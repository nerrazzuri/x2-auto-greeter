# X2 auto-greeter parameters. Defaults follow the design spec, section 13.
/**:
  ros__parameters:
    camera:
      rgb_topic: /aima/hal/sensor/rgbd_head_front/rgb_image
      depth_topic: /aima/hal/sensor/rgbd_head_front/depth_image
      # Metres per depth unit. 0.001 for a 16UC1 millimetre image, 1.0 for
      # 32FC1 metres. Confirm against the real camera on first hardware access.
      depth_scale: 0.001
      max_sync_skew_s: 0.15
      stale_warn_s: 5.0
      # Turn both the colour and depth frames half a turn before use. Needed
      # where the head RGB-D module is mounted upside down: MobileNet-SSD does
      # not recognise an inverted person (measured on hardware: 0.00 as-is,
      # 0.92 rotated, on the same frame that scored sofa=0.75 either way), so
      # the symptom is a node that runs at full rate and never greets anyone.
      # Check with `python3 tools/check_camera_orientation.py` before setting.
      # The proper fix is the driver's own color_rotation/depth_rotation
      # arguments; this exists because that means restarting a robot service.
      rotate_180: false

    detect:
      # mobilenet_ssd | hog | scripted. mobilenet_ssd falls back to hog with a
      # warning when the weights are absent; run tools/fetch_model.py to get them.
      detector: mobilenet_ssd
      model_dir: ''
      confidence_min: 0.5
      distance_min_m: 1.0
      distance_max_m: 3.0
      center_tolerance: 0.25

    presence:
      dwell_s: 1.0
      loss_grace_s: 0.5
      clear_s: 3.0
      cooldown_s: 30.0
      reject_cooldown_s: 5.0
      confirm_timeout_s: 10.0

    interaction:
      # The X2 runs its own interaction system on the same speaker. While that
      # is talking to somebody, the greeter stays quiet: cutting across an
      # answer the person was waiting for is worse than not greeting at all.
      respect_busy: true
      tts_status_topic: /interaction/tts_status
      play_state_topic: /aima/hal/audio/play_state
      # Both topics are event-driven, so a missed end-of-speech would mute the
      # greeter for good. Busy expires this long after the message that set
      # it, with a warning.
      busy_timeout_s: 15.0

    mc_input:
      # The controller discards motion commands from unregistered sources
      # (SDK docs 5.1.3). Priority must stay in the documented SDK band 20-39:
      # the remote controller sits at 80 and must keep its override, and
      # 100-80 is reserved for emergency stop and safety modes. A source that
      # goes quiet for `timeout_ms` is re-arbitrated, which is what lets the
      # operator take the robot back simply by picking the remote up.
      enabled: true
      name: x2_greeter
      priority: 30
      timeout_ms: 1000

    backend:
      # claude | canned. Named 'provider' rather than 'backend' because ROS 2
      # forbids a parameter that is also a prefix of another parameter.
      provider: claude
      model: claude-opus-5
      effort: low
      # Measured on an X2 against claude-opus-5 at effort low with a 512 px
      # JPEG: 3.1 s, 3.4 s, 6.0 s (median 3.4 s). The 2.5 s this shipped with
      # was a guess made without hardware, and it is unreachable -- every call
      # timed out and fell back to a canned phrase, which looks like a working
      # system with a dull vocabulary rather than a broken one. Must stay below
      # presence.confirm_timeout_s; test_shipped_config.py enforces that.
      timeout_s: 8.0

    speech:
      # auto | tts | audio_file
      tier: auto
      domain: x2_greeter
      priority_level: 6
      # Audio assets live on PC3 (10.0.1.42), world-readable.
      audio_dir: /var/tmp/x2_greeter_audio
      audio_file_count: 20
      phrases_file: ''

    gestures:
      enabled:
        - wave
        - salute
        - handshake
        - raise_hand
        - raise_both
        - bow
        - high_five
        - wave_chest
        - cheer
        - blow_kiss
        - heart
      # left | right | both | random
      hand_preference: right

    safety:
      require_stand_default: true
