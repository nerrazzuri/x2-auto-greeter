# X2 auto-greeter parameters. Defaults follow the design spec, section 13.
/**:
  ros__parameters:
    camera:
      # rgbd     -- chin RGB-D for both colour and depth (the original)
      # stereo   -- head stereo colour, chin depth reprojected onto it
      #
      # On the X2 the chin module is mounted low and steeply angled: a person
      # standing 1.5 m away passed the gate on 26% of frames, in bursts of
      # 0.17 s, so the tracker took 5.1 s to greet them. The head stereo pair
      # sees the same person at 0.94-1.00 confidence. It has no depth of its
      # own, so the chin module's is reprojected into its pixels -- exact,
      # because both cameras are fixed children of head_pitch_link.
      source: rgbd
      rgb_topic: /aima/hal/sensor/rgbd_head_front/rgb_image
      depth_topic: /aima/hal/sensor/rgbd_head_front/depth_image
      # Metres per depth unit. 0.001 for a 16UC1 millimetre image, 1.0 for
      # 32FC1 metres. Confirm against the real camera on first hardware access.
      depth_scale: 0.001
      max_sync_skew_s: 0.15
      stale_warn_s: 5.0
      # Turn both the colour and depth frames half a turn before use. Needed
      # where the head RGB-D module is mounted upside down: MobileNet-SSD does
      # not recognise an inverted person (measured on hardware: 0.00 as-is,
      # 0.92 rotated, on the same frame that scored sofa=0.75 either way), so
      # the symptom is a node that runs at full rate and never greets anyone.
      # Check with `python3 tools/check_camera_orientation.py` before setting.
      # The proper fix is the driver's own color_rotation/depth_rotation
      # arguments; this exists because that means restarting a robot service.
      rotate_180: false

      # --- used only when source is 'stereo' ---
      # The stereo image is upright; do not rotate it. Only the chin module is
      # mounted upside down.
      stereo_rgb_topic: /aima/hal/sensor/stereo_head_front_left/rgb_image
      stereo_info_topic: /aima/hal/sensor/stereo_head_front_left/camera_info
      depth_info_topic: /aima/hal/sensor/rgbd_head_front/depth_camera_info
      # From the robot's own URDF (x2_31dof_hand.urdf), both fixed children of
      # head_pitch_link, so the pair is a constant however the head is posed.
      # Check them against the URDF on a new robot before trusting a distance.
      rgbd_xyz: [0.05761, -0.011183, -0.04837]
      rgbd_rpy: [2.2689, 0.0, 1.5708]
      stereo_xyz: [0.067995, 0.029784, 0.05]
      stereo_rpy: [-1.5708, 0.0, -1.574]
      # Subsampling of the depth image and of the output map. Both trade
      # fidelity for time; the result is a sparse splat and median_depth_m
      # takes a median over whatever it finds.
      #
      # step 8, not 4. Measured on hardware: at 4 the reprojection cost half
      # the stereo frame rate (5.7 Hz of 10) and the gate passed on 29% of
      # frames; at 8 it runs at 9.9 Hz and the gate passed on 296 of 296. The
      # denser sampling bought nothing -- a person's box still holds ~1950
      # depth pixels at step 8, where a median needs tens.
      reproject_step: 8
      reproject_scale: 4

    detect:
      # mobilenet_ssd | hog | scripted. mobilenet_ssd falls back to hog with a
      # warning when the weights are absent; run tools/fetch_model.py to get them.
      detector: mobilenet_ssd
      model_dir: ''
      confidence_min: 0.5
      distance_min_m: 1.0
      distance_max_m: 3.0
      center_tolerance: 0.25

    presence:
      dwell_s: 1.0
      loss_grace_s: 0.5
      # After a greeting the tracker waits for BOTH: cooldown_s to elapse, and
      # clear_s with nobody in the gate at all. The clear timer restarts the
      # moment anybody is detected, which is how "do not greet the same person
      # forever" works without face recognition -- the tracker has no identity,
      # so it cannot tell the next person in a queue from the one who has not
      # left yet.
      #
      # The consequence, seen in a demo: greet somebody, and the person right
      # behind them is not greeted, because their standing there keeps
      # resetting the clear timer. 30 s / 3 s was tuned for a corridor; these
      # are tuned for a queue.
      clear_s: 2.0
      cooldown_s: 10.0
      reject_cooldown_s: 5.0
      confirm_timeout_s: 10.0

    interaction:
      # The X2 runs its own interaction system on the same speaker. While that
      # is talking to somebody, the greeter stays quiet: cutting across an
      # answer the person was waiting for is worse than not greeting at all.
      respect_busy: true
      tts_status_topic: /interaction/tts_status
      play_state_topic: /aima/hal/audio/play_state
      # Both topics are event-driven, so a missed end-of-speech would mute the
      # greeter for good. Busy expires this long after the message that set
      # it, with a warning.
      busy_timeout_s: 15.0

    mc_input:
      # The controller discards motion commands from unregistered sources
      # (SDK docs 5.1.3). Priority must stay in the documented SDK band 20-39:
      # the remote controller sits at 80 and must keep its override, and
      # 100-80 is reserved for emergency stop and safety modes. A source that
      # goes quiet for `timeout_ms` is re-arbitrated, which is what lets the
      # operator take the robot back simply by picking the remote up.
      enabled: true
      name: x2_greeter
      priority: 30
      timeout_ms: 1000

    backend:
      # claude | canned. Named 'provider' rather than 'backend' because ROS 2
      # forbids a parameter that is also a prefix of another parameter.
      provider: claude
      model: claude-opus-5
      effort: low
      # Measured on an X2 against claude-opus-5 at effort low with a 512 px
      # JPEG: 3.1 s, 3.4 s, 6.0 s (median 3.4 s). The 2.5 s this shipped with
      # was a guess made without hardware, and it is unreachable -- every call
      # timed out and fell back to a canned phrase, which looks like a working
      # system with a dull vocabulary rather than a broken one. Must stay below
      # presence.confirm_timeout_s; test_shipped_config.py enforces that.
      timeout_s: 8.0

    speech:
      # auto | tts | audio_file
      tier: auto
      domain: x2_greeter
      # TtsPriorityLevel: BACKGROUND_L1=1, SERVICE_L2=2, MISSION_L4=4,
      # INTERACTION_L6=6, SYSTEM_L7=7, WARNING_L8=8, SAFETY_L10=10.
      # INTERACTION_L6 is the vendor's own default for PlayTtsRequest, and the
      # interaction module occupies the audio streams by default (SDK 8.1).
      # Lowering this to SERVICE_L2 looked more polite and was tried on
      # hardware: PlayTts kept answering is_success, and nothing came out of
      # the speaker. A quieter greeter that cannot be heard is not politeness.
      priority_level: 6
      # Consecutive PlayTts failures before falling back to recordings for the
      # session. Never 1: a dropped cross-host response says nothing about TTS
      # (the utterance may have played), and a priority_rejected is about one
      # request losing audio arbitration. Demoting on a single failure once
      # left the greeter silent for a whole session -- greeting and gesturing
      # normally, with no sound and nothing in the log after one warning.
      tts_failures_before_demotion: 3
      # Audio assets live on PC3 (10.0.1.42), world-readable.
      audio_dir: /var/tmp/x2_greeter_audio
      audio_file_count: 20
      phrases_file: ''
      # Appended to every greeting, canned or cloud, one picked at random.
      # The X2's interaction system only opens a voice session on its wake
      # word, and nothing in the served SDK can open one for it, so the
      # greeting ends by telling the person the words that do work. Set to an
      # empty list on a robot where that is not true.
      wake_invitations:
        - Say Hi Lumi and I will be happy to chat.
        - Call out Hi Lumi and we can have a proper conversation.
        - Just say Hi Lumi whenever you would like to talk.
        - If you fancy a chat, say Hi Lumi and I am all ears.
        - Say Hi Lumi and we can talk about whatever you like.

    gestures:
      enabled:
        - wave
        - salute
        - handshake
        - raise_hand
        - raise_both
        - bow
        - high_five
        - wave_chest
        - cheer
        - blow_kiss
        - heart
      # Gestures permitted while the robot is walking (LOCOMOTION_DEFAULT).
      # Ships empty: the SDK documents no preset motion as safe during
      # locomotion -- only "some motions may require the robot to be in a
      # specific posture" -- so every entry here must be one somebody has
      # validated on hardware. Names must also appear in `enabled` above, and
      # must not command the waist: test_shipped_config.py enforces both,
      # because a waist motion moves the centre of mass of a robot that is
      # already balancing on one foot.
      enabled_while_walking: []
      # left | right | both | random
      hand_preference: right

    safety:
      require_stand_default: true
