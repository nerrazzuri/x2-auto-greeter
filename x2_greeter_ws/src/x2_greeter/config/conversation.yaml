# The conversational interaction node.
#
# Every hardware-gated feature below ships disabled. None of them has run on
# this robot under our code, and each one is a one-line edit away from being
# on. Tune on site, with a human within reach of the stop control.
#
# Anything with a test in test/test_shipped_config.py is pinned deliberately.
# Widening one of those means changing the test too, which means somebody
# reads the reason before the robot does.
/**:
  ros__parameters:

    venue:
      # A file under config/venues/, without the .yaml.
      profile: "clothing_store"

    camera:
      # rgbd   -- the chin RGB-D module for both colour and depth
      # stereo -- the head stereo pair's colour, with the chin module's depth
      #           reprojected into its pixels
      #
      # Phase 1 measured the difference on this hardware: the chin module is
      # mounted low and steeply angled, and a person standing 1.5 m away
      # passed the distance gate on 26% of frames, in bursts of 0.17 s -- 5.1 s
      # before anybody was greeted. The head pair saw the same person at
      # 0.94-1.00 confidence and brought that to 1.0 s. A conversation that
      # takes five seconds to open is one the person has already left.
      #
      # It ships rgbd because that is what this node has been run with. Set it
      # to stereo on a robot where the head pair has been checked, and read
      # the coverage line the node logs at startup.
      source: rgbd
      rgb_topic: /aima/hal/sensor/rgbd_head_front/rgb_image
      depth_topic: /aima/hal/sensor/rgbd_head_front/depth_image
      depth_scale: 0.001
      max_sync_skew_s: 0.15
      stale_warn_s: 5.0
      # Only the chin module is mounted upside down, and only on some robots.
      # MobileNet-SSD does not recognise an inverted person, so getting this
      # wrong gives a node that runs at full rate and greets nobody. Check
      # with tools/check_camera_orientation.py; it does not apply to stereo.
      rotate_180: false

      # --- used only when source is 'stereo' ---
      stereo_rgb_topic: /aima/hal/sensor/stereo_head_front_left/rgb_image
      stereo_info_topic: /aima/hal/sensor/stereo_head_front_left/camera_info
      depth_info_topic: /aima/hal/sensor/rgbd_head_front/depth_camera_info
      # From the robot's own URDF (x2_31dof_hand.urdf): both cameras are fixed
      # children of head_pitch_link, so the pair is constant however the head
      # is posed. Check them against the URDF on a new robot.
      rgbd_xyz: [0.05761, -0.011183, -0.04837]
      rgbd_rpy: [2.2689, 0.0, 1.5708]
      stereo_xyz: [0.067995, 0.029784, 0.05]
      stereo_rpy: [-1.5708, 0.0, -1.574]
      # 8, not 4: at 4 the reprojection cost half the stereo frame rate and
      # the gate passed on 29% of frames; at 8 it runs at 9.9 Hz and passed on
      # 296 of 296. The denser sampling bought nothing.
      reproject_step: 8
      reproject_scale: 4

    detect:
      # mobilenet_ssd | hog | scripted
      detector: mobilenet_ssd
      model_dir: ''

    presence:
      confidence_min: 0.5
      # Anyone inside this is addressed individually; a room where everyone
      # is further away is addressed as a group. Locked at session start.
      individual_max_m: 2.0
      # How far out the robot reads the room. Deliberately wider than the
      # 3.0 m Phase 1 greeting trigger: seeing the six people behind the one
      # in front is the point.
      scene_max_m: 5.0
      child_stature_max_m: 1.35

    conversation:
      max_turns: 8
      silence_timeout_s: 8.0
      # The promise that the robot lets go, not a resource limit.
      session_max_s: 180.0
      cooldown_s: 20.0
      backend_failures_max: 2
      history_max: 12
      reply_max_chars: 200

    language:
      # English default, following whoever is speaking. Malay is next phase.
      default: "en"
      switch_confidence: 0.7
      # NOT READ AT RUNTIME. The node uses core/language.py's
      # ALLOWED_LANGUAGES constant; this list records it so a drift between
      # the two fails test_shipped_config.py instead of surprising somebody
      # on site. Adding a language here does nothing until the code changes.
      allowed: ["en", "zh"]

    hearing:
      enabled: true
      topic: "/agent/process_audio_output"
      max_utterance_s: 15.0
      # faster-whisper, local on PC2. No new vendor, no audio leaving the robot.
      model_size: "small"
      device: "auto"
      compute_type: "int8"

    dialogue:
      model: "claude-opus-5"
      effort: "low"
      # Must stay under conversation.silence_timeout_s: a backend still
      # thinking when the silence timer fires would close its own session.
      timeout_s: 6.0

    speech:
      # NEITHER KEY IS READ AT RUNTIME. ros/speech.py (Phase 1 code, proven
      # on this robot) hardcodes the service and its own timeout, and the
      # node does not pass these through. They are recorded here because
      # test_shipped_config.py pins the service name against the value in
      # that module, so the pair cannot drift apart unnoticed -- but
      # changing either one here has no effect. A wrong TTS service needs a
      # code change and a rebuild, not a YAML edit.
      service: "/aimdk_5Fmsgs/srv/PlayTts"
      timeout_s: 10.0

    gestures:
      enabled:
        - "wave"
        - "salute"
        - "handshake"
        - "raise_hand"
        - "raise_both"
        - "bow"
        - "high_five"
        - "wave_chest"
        - "cheer"
        - "blow_kiss"
        - "heart"
      hand_preference: "right"

    face:
      # OFF. Never run on hardware.
      enabled: false
      service: "/aimdk_5Fmsgs/srv/PlayEmoji"
      enabled_expressions:
        - "thinking"
        - "calm"
        - "blink"
        - "happy"
        - "very_happy"
        - "cute"
        - "confused"
        - "sympathy"

    head:
      # OFF. Never run on hardware. Yaw only, and clamped to 0.262 rad in
      # two places before it reaches a motor.
      enabled: false
      sweep_on_start: false
      gaze_follow: false
      command_topic: "/aima/hal/joint/head/command"
      state_topic: "/aima/hal/joint/head/state"
      rate_hz: 20.0

    base_frame:
      # OFF. The wide 156-degree view of the room. Until this is on, the
      # base frame is a head-camera frame captured at session start, which
      # works and simply sees less.
      use_env_camera: false
      # Confirm the real front-stereo topic on site before flipping the flag
      # above:
      #   ros2 topic list | grep -i -E 'stereo|front|fisheye'
      rgb_topic: "/aima/hal/sensor/stereo_head_front_left/rgb_image"
      rotate_180: false

    safety:
      require_stand_default: true
      gesture_min_distance_m: 1.0
      stale_distance_s: 1.0

    mc_input:
      name: "x2_greeter"
      # Inside the documented SDK band 20-39. The remote controller stays at
      # 80 and keeps its override.
      priority: 30
