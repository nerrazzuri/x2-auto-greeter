# What every X2 greeter deployment sets, on top of the shipped greeter.yaml.
#
# Not per customer. These four decisions came out of bring-up on real hardware
# and hold for every venue: run offline, use the head stereo pair, never fall
# back to recordings. What differs from one customer to the next is the
# greeting list, and that is chosen with install.sh --phrases NAME.
#
# Only keys that differ from greeter.yaml belong here. Everything else -- the
# detection gates, the safety interlocks, the timings tuned on hardware --
# stays where it is documented and is not repeated or shadowed by this file.
#
# Deliberately NOT here: camera.rotate_180. Whether the chin module is mounted
# upside down is a property of one robot, not of this deployment, and it has
# no effect at all while camera.source is stereo. It stays a per-robot value
# in that robot's own site.yaml, which is seeded once and never overwritten.

backend:
  # No cloud call, so no ANTHROPIC_API_KEY and no per-greeting latency: the
  # phrase list is the whole vocabulary, and the customer wrote it.
  provider: canned

camera:
  # The head stereo pair, with the chin module's depth reprojected into it.
  # Phase 1 measured the difference: a person at 1.5 m passed the distance
  # gate on 26% of chin-module frames and was greeted after 5.1 s; the head
  # pair saw the same person at 0.94-1.00 confidence and greeted in 1.0 s.
  source: stereo

speech:
  # tts, not auto. `auto` demotes to the recordings on PC3 after repeated TTS
  # failures, and those were recorded from config/phrases.yaml -- so a demoted
  # robot would start saying lines that are not in the customer's script.
  # Silence is the better failure here.
  tier: tts
